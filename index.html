<style>
/* Layout: telefon uygulaması — üst başlık, kayan içerik, altta sabit özet şeridi + sekme çubuğu */
:root {
  color-scheme: dark;
  --bg: #14120d;
  --panel: #1f1c15;
  --panel-2: #29251b;
  --raised: #332e21;
  --line: #3a3426;
  --fg: #efe9d6;
  --muted: #9f977f;
  --sulfur: #e8c547;
  --sulfur-dim: #6b5c27;
  --sulfur-ink: #1d1a0c;
  --danger: #e0674a;
  --f-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  overscroll-behavior-y: none;
}
input { -webkit-user-select: text; user-select: text; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sulfur); outline-offset: 2px; }
svg.i { display: block; flex: none; }

/* Üst başlık */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 12px 10px;
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; letter-spacing: .03em; margin: 0; text-transform: uppercase; line-height: 1; }
h1 span { color: var(--sulfur); }
.top small { font-family: var(--f-display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-size: .72rem; }

main {
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 16px calc(160px + env(safe-area-inset-bottom, 0px));
}
.view { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
h2 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .9rem; color: var(--muted); margin: 0; }
.link { color: var(--muted); font-size: .84rem; text-decoration: underline; text-underline-offset: 3px; }
.tag { font-family: var(--f-mono); font-size: .7rem; color: var(--sulfur); border: 1px solid var(--sulfur-dim); border-radius: 999px; padding: 2px 8px; }
.note { font-size: .78rem; color: var(--muted); margin: 0; }

/* Patlayıcı seçici */
.picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pick {
  background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0;
  transition: transform .12s, border-color .15s, background .15s;
}
.pick svg { width: 44px; height: 44px; }
.pick b { font-family: var(--f-display); font-weight: 700; font-size: 1rem; letter-spacing: .02em; line-height: 1.1; }
.pick small { font-family: var(--f-mono); font-size: .66rem; color: var(--muted); }
.pick[aria-pressed="true"] { border-color: var(--sulfur); background: var(--raised); box-shadow: 0 0 0 3px rgba(232,197,71,.14); }
.pick[aria-pressed="true"] b { color: var(--sulfur); }
.pick:active { transform: scale(.96); }

/* Hedef kutuları */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  position: relative; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px;
  padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  transition: border-color .15s, background .15s;
}
.tile.on { border-color: var(--sulfur-dim); background: var(--panel-2); }
.tile .art { display: flex; align-items: flex-start; justify-content: space-between; }
.tile .art svg { width: 52px; height: 52px; }
.badge { font-family: var(--f-mono); font-weight: 700; font-size: .95rem; background: var(--sulfur); color: var(--sulfur-ink); border-radius: 999px; padding: 2px 9px; min-width: 32px; text-align: center; }
.tile:not(.on) .badge { visibility: hidden; }
.tname { font-weight: 600; font-size: .95rem; line-height: 1.2; }
.need { display: flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.need svg { width: 18px; height: 18px; }
.need b { color: var(--fg); }
.step { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.step button { height: 40px; font-size: 1.35rem; line-height: 1; color: var(--fg); }
.step button:active { background: var(--raised); }
.step output { text-align: center; font-family: var(--f-mono); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.tile.on .step output { color: var(--sulfur); }

/* Alt dok: özet şeridi + sekmeler */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: rgba(20,18,13,.94); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.dock-in { max-width: 560px; margin: 0 auto; }
.strip {
  margin-top: 10px; width: 100%; display: flex; align-items: center; gap: 12px;
  background: var(--sulfur); color: var(--sulfur-ink); border-radius: 14px; padding: 9px 12px; text-align: left;
}
.strip svg.big { width: 38px; height: 38px; background: rgba(29,26,12,.14); border-radius: 10px; padding: 3px; }
.strip .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.strip .q { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
.strip .s { font-family: var(--f-mono); font-weight: 700; font-size: .85rem; }
.strip .go { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .85rem; white-space: nowrap; }
.strip[disabled] { background: var(--panel-2); color: var(--muted); }
.strip[disabled] svg.big { background: var(--bg); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); padding-block: 6px 4px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: .7rem; font-weight: 600; letter-spacing: .02em; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--sulfur); }

/* Malzeme listesi */
.hero-need { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1.5px solid var(--sulfur-dim); border-radius: 18px; padding: 16px; }
.hero-need svg { width: 64px; height: 64px; }
.hero-need .n { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1; text-transform: uppercase; }
.hero-need .n span { color: var(--sulfur); }
.hero-need .sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.mats { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.mat { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.mat:last-child { border-bottom: 0; }
.mat svg { width: 36px; height: 36px; background: var(--bg); border-radius: 9px; padding: 3px; }
.mat .nm { flex: 1; min-width: 0; font-weight: 500; }
.mat .nm small { display: block; color: var(--muted); font-size: .74rem; font-weight: 400; }
.mat .v { font-family: var(--f-mono); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.mat.key .v { color: var(--sulfur); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 4px; font-size: .84rem; }
.chip svg { width: 26px; height: 26px; }
.chip b { font-family: var(--f-mono); color: var(--sulfur); }
.empty { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); }
.empty svg { width: 72px; height: 72px; opacity: .55; }
.btn { background: var(--sulfur); color: var(--sulfur-ink); font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 10px 18px; border-radius: 12px; }

/* Sülfür */
.field { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.field svg { width: 44px; height: 44px; }
.field label { display: block; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: var(--f-display); font-weight: 600; }
.field input { width: 100%; font-family: var(--f-mono); font-size: 1.7rem; font-weight: 700; background: none; border: 0; color: var(--fg); padding: 0; outline: none; }
.field:focus-within { border-color: var(--sulfur); }
.quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.quick button { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-family: var(--f-mono); font-size: .82rem; }
.craft { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.craft div { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.craft svg { width: 46px; height: 46px; }
.craft b { font-family: var(--f-mono); font-size: 1.9rem; color: var(--sulfur); font-variant-numeric: tabular-nums; line-height: 1; }
.craft span { font-weight: 600; }
.craft small { font-size: .74rem; color: var(--muted); }

/* Tarifler */
.recipe { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.recipe-h { display: flex; align-items: center; gap: 12px; }
.recipe-h svg { width: 48px; height: 48px; }
.recipe-h b { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .02em; display: block; line-height: 1.1; }
.recipe-h small { color: var(--muted); font-size: .78rem; }
.eq { font-family: var(--f-display); color: var(--muted); font-weight: 700; }

@media (max-width: 370px) { .pick small { display: none; } .tile .art svg { width: 44px; height: 44px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      <circle cx="31" cy="25" r="2" fill="#e8c547"/>
    </symbol>
    <symbol id="i-garage" viewBox="0 0 48 48">
      <rect x="4" y="6" width="40" height="38" rx="2" fill="#2a2621"/>
      <rect x="7" y="9" width="34" height="35" fill="var(--t1)"/>
      <path d="M7 15.5h34 M7 22h34 M7 28.5h34 M7 35h34" stroke="var(--t2)" stroke-width="2.4"/>
      <rect x="20" y="38" width="8" height="2.5" rx="1" fill="#e8c547"/>
    </symbol>
    <symbol id="i-hatch" viewBox="0 0 48 48">
      <rect x="5" y="5" width="38" height="38" rx="3" fill="var(--t1)"/>
      <rect x="9" y="9" width="30" height="30" rx="2" fill="none" stroke="var(--t2)" stroke-width="2"/>
      <path d="M18 9 v30 M30 9 v30 M18 15h12 M18 21h12 M18 27h12 M18 33h12" stroke="var(--t2)" stroke-width="2.4"/>
      <rect x="21" y="39" width="6" height="3" rx="1" fill="#e8c547"/>
    </symbol>
    <symbol id="i-wall" viewBox="0 0 48 48">
      <rect x="4" y="6" width="40" height="38" rx="2" fill="var(--t1)"/>
      <path d="M4 15.5h40 M4 25h40 M4 34.5h40 M16 6v9.5 M32 6v9.5 M10 15.5v9.5 M24 15.5v9.5 M38 15.5v9.5 M16 25v9.5 M32 25v9.5 M10 34.5v9.5 M24 34.5v9.5 M38 34.5v9.5" stroke="var(--t2)" stroke-width="2"/>
    </symbol>
    <symbol id="i-hes" viewBox="0 0 48 48">
      <path d="M4 45 V12 L8.5 4 L13 12 V45Z M14 45 V12 L18.5 4 L23 12 V45Z M24 45 V12 L28.5 4 L33 12 V45Z M34 45 V12 L38.5 4 L43 12 V45Z" fill="var(--t1)"/>
      <path d="M4 22h39 M4 34h39" stroke="var(--t2)" stroke-width="2.4"/>
    </symbol>
    <!-- Sekme ikonları -->
    <symbol id="t-raid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></g></symbol>
    <symbol id="t-mat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 18 10 5 10-5" opacity=".5"/></g></symbol>
    <symbol id="t-sulfur" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21 8 11l4 10Z"/><path d="M9 21 15 4l6 17Z"/></g></symbol>
    <symbol id="t-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H4Z"/><path d="M20 4h-4a2 2 0 0 0-2 2"/><path d="M14 19h6V4"/></g></symbol>
  </defs>
</svg>

<header class="top">
  <div class="top-in">
    <div class="brand"><svg class="i"><use href="#i-c4"/></svg><h1>Raid <span>Hesap</span></h1></div>
    <small id="top-sub">Rust araç kiti</small>
  </div>
</header>

<main>
  <!-- RAID -->
  <section class="view" id="view-raid">
    <div class="sec">
      <h2>Patlayıcını seç</h2>
      <div class="picker" id="picker"></div>
    </div>
    <div class="sec">
      <div class="sec-h">
        <h2>Ne patlatacaksın?</h2>
        <span style="display:flex;gap:10px;align-items:center"><span class="tag" id="example-tag">örnek</span><button class="link" id="reset">Sıfırla</button></span>
      </div>
      <div class="tiles" id="tiles"></div>
    </div>
    <p class="note">Değerler yaklaşıktır, oyun güncellemeleriyle değişebilir.</p>
  </section>

  <!-- MALZEME -->
  <section class="view" id="view-mat" hidden></section>

  <!-- SÜLFÜR -->
  <section class="view" id="view-sulfur" hidden>
    <div class="sec">
      <h2>Elindeki sülfür</h2>
      <div class="field">
        <svg class="i"><use href="#i-sulfur"/></svg>
        <div style="flex:1;min-width:0"><label for="sulfur-in">Miktar</label><input id="sulfur-in" type="number" inputmode="numeric" min="0" step="100" value="10000"></div>
      </div>
      <div class="quick" id="quick"></div>
    </div>
    <div class="sec">
      <h2>Bununla yapabileceğin</h2>
      <div class="craft" id="craft"></div>
    </div>
  </section>

  <!-- TARİFLER -->
  <section class="view" id="view-book" hidden>
    <div class="sec" id="recipes"><h2>Ne neyle yapılır?</h2></div>
    <p class="note">Tarifler ve raid sayıları yaklaşıktır; Facepunch güncellemelerinde değişebilir.</p>
  </section>
</main>

<nav class="dock">
  <div class="dock-in">
    <button class="strip" id="strip"></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="raid"><svg class="i"><use href="#t-raid"/></svg>Raid</button>
      <button class="tab" role="tab" data-tab="mat"><svg class="i"><use href="#t-mat"/></svg>Malzeme</button>
      <button class="tab" role="tab" data-tab="sulfur"><svg class="i"><use href="#t-sulfur"/></svg>Sülfür</button>
      <button class="tab" role="tab" data-tab="book"><svg class="i"><use href="#t-book"/></svg>Tarifler</button>
    </div>
  </div>
</nav>

<script>
const ico = (id, cls = "i", style = "") => `<svg class="${cls}"${style ? ` style="${style}"` : ""}><use href="#i-${id}"/></svg>`;
const fmt = n => Math.round(n).toLocaleString("tr-TR");

const MAT = {
  sulfur:     { name: "Sülfür",              icon: "sulfur" },
  gp:         { name: "Barut",               icon: "gp" },
  char:       { name: "Kömür",               icon: "char" },
  frag:       { name: "Metal parça",         icon: "frag" },
  lgf:        { name: "Düşük kalite yakıt",  icon: "lgf" },
  explosives: { name: "Patlayıcı",           icon: "explosives" },
  beancan:    { name: "Beancan bombası",     icon: "beancan" },
  cloth:      { name: "Bez",                 icon: "cloth" },
  tech:       { name: "Tech trash",          icon: "tech" },
  pipe:       { name: "Metal boru",          icon: "pipe" },
  rope:       { name: "İp",                  icon: "rope" },
  stash:      { name: "Küçük sandık",        icon: "stash" },
};
// Doğrudan tarif (1 adet için)
const EXP = {
  c4:      { name: "C4",     long: "C4 (Timed Explosive)", icon: "c4",      ins: { explosives: 20, cloth: 5, tech: 2 } },
  rocket:  { name: "Roket",  long: "Roket",                icon: "rocket",  ins: { explosives: 10, gp: 150, pipe: 2 } },
  satchel: { name: "Çanta",  long: "Satchel Charge",       icon: "satchel", ins: { beancan: 4, stash: 1, rope: 1 } },
  ammo:    { name: "Mermi",  long: "Patlayıcı 5.56 mermi", icon: "ammo",    ins: { gp: 10, sulfur: 5, frag: 5 } },
};
const SUB = [
  { icon: "explosives", name: "Patlayıcı", out: 1, ins: { gp: 50, sulfur: 10, frag: 10, lgf: 3 } },
  { icon: "beancan", name: "Beancan bombası", out: 1, ins: { gp: 60, frag: 20 } },
  { icon: "gp", name: "Barut", out: 10, ins: { sulfur: 20, char: 30 } },
];
const T = {
  wood:  "--t1:#8a6338;--t2:#6b4a27",
  sheet: "--t1:#8d9499;--t2:#666d72",
  armor: "--t1:#4d5358;--t2:#2f3438",
  stone: "--t1:#9a958a;--t2:#6f6b63",
};
const TARGETS = [
  { id: "wdoor",  name: "Ahşap kapı",       icon: "door",   tier: "wood",  c4: 1, rocket: 2,  satchel: 2,  ammo: 19 },
  { id: "sdoor",  name: "Metal kapı",        icon: "door",   tier: "sheet", c4: 1, rocket: 2,  satchel: 4,  ammo: 63 },
  { id: "gdoor",  name: "Garaj kapısı",     icon: "garage", tier: "sheet", c4: 2, rocket: 3,  satchel: 9,  ammo: 150 },
  { id: "adoor",  name: "Zırhlı kapı",      icon: "door",   tier: "armor", c4: 2, rocket: 4,  satchel: 12, ammo: 200 },
  { id: "hatch",  name: "Merdivenli kapak", icon: "hatch",  tier: "sheet", c4: 1, rocket: 2,  satchel: 4,  ammo: 63 },
  { id: "wwall",  name: "Ahşap duvar",      icon: "wall",   tier: "wood",  c4: 1, rocket: 2,  satchel: 3,  ammo: 49 },
  { id: "stwall", name: "Taş duvar",        icon: "wall",   tier: "stone", c4: 4, rocket: 10, satchel: 10, ammo: 185 },
  { id: "smwall", name: "Metal duvar",       icon: "wall",   tier: "sheet", c4: 4, rocket: 8,  satchel: 23, ammo: 400 },
  { id: "awall",  name: "Zırhlı duvar",     icon: "wall",   tier: "armor", c4: 8, rocket: 15, satchel: 46, ammo: 799 },
  { id: "hes",    name: "Yüksek taş sur",   icon: "hes",    tier: "stone", c4: 4, rocket: 10, satchel: 10, ammo: 185 },
];

// E adet patlayıcı için tüm malzeme dökümü
function breakdown(k, E) {
  const r = Object.fromEntries(Object.keys(MAT).map(m => [m, 0]));
  for (const m in EXP[k].ins) r[m] += EXP[k].ins[m] * E;
  const direct = { gp: r.gp, sulfur: r.sulfur, frag: r.frag };
  r.gp = direct.gp + r.explosives * 50 + r.beancan * 60;
  r.sulfur = direct.sulfur + r.explosives * 10 + r.gp * 2;
  r.char = r.gp * 3;
  r.frag = direct.frag + r.explosives * 10 + r.beancan * 20;
  r.lgf = r.explosives * 3;
  return r;
}
const unitSulfur = k => breakdown(k, 1).sulfur;

const EXAMPLE = { adoor: 1, stwall: 2 };
let state = { exp: "c4", counts: { ...EXAMPLE }, example: true, tab: "raid", sulfur: 10000 };
try { const s = JSON.parse(localStorage.getItem("raidhesap2")); if (s && s.counts && EXP[s.exp]) state = { ...state, ...s }; } catch (e) {}
const save = () => { try { localStorage.setItem("raidhesap2", JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);

// Patlayıcı seçici
$("picker").innerHTML = Object.keys(EXP).map(k =>
  `<button class="pick" data-exp="${k}">${ico(EXP[k].icon)}<b>${EXP[k].name}</b><small>${fmt(unitSulfur(k))} S</small></button>`).join("");
$("picker").querySelectorAll(".pick").forEach(b => b.onclick = () => { state.exp = b.dataset.exp; render(); });

// Hedef kutuları
$("tiles").innerHTML = TARGETS.map(t => `
  <div class="tile" data-id="${t.id}">
    <div class="art">${ico(t.icon, "i", T[t.tier])}<span class="badge"></span></div>
    <div class="tname">${t.name}</div>
    <div class="need"></div>
    <div class="step"><button aria-label="${t.name} azalt" data-d="-1">−</button><output>0</output><button aria-label="${t.name} artır" data-d="1">+</button></div>
  </div>`).join("");
$("tiles").querySelectorAll(".tile").forEach(el => {
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    const id = el.dataset.id;
    state.counts[id] = Math.max(0, (state.counts[id] || 0) + Number(b.dataset.d));
    state.example = false; render();
  });
});
$("reset").onclick = () => { state.counts = {}; state.example = false; render(); };

// Sekmeler
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
$("strip").onclick = () => { state.tab = state.tab === "mat" ? "raid" : "mat"; render(); window.scrollTo(0, 0); };

// Sülfür
const input = $("sulfur-in");
input.value = state.sulfur;
input.oninput = () => { state.sulfur = input.value; render(); };
$("quick").innerHTML = [2200, 5000, 10000, 20000, 50000, 100000].map(v => `<button data-v="${v}">${fmt(v)}</button>`).join("");
$("quick").querySelectorAll("button").forEach(b => b.onclick = () => { input.value = b.dataset.v; state.sulfur = b.dataset.v; render(); });

// Tarifler (sabit)
const chip = (m, q) => `<span class="chip">${ico(MAT[m].icon)}<b>${fmt(q)}</b> ${MAT[m].name}</span>`;
$("recipes").insertAdjacentHTML("beforeend",
  Object.keys(EXP).map(k => `
    <div class="recipe">
      <div class="recipe-h">${ico(EXP[k].icon)}<div><b>${EXP[k].long}</b><small>Toplam ${fmt(unitSulfur(k))} sülfür</small></div></div>
      <div class="chips">${Object.entries(EXP[k].ins).map(([m, q]) => chip(m, q)).join("")}</div>
    </div>`).join("") +
  `<h2 style="margin-top:8px">Ara ürünler</h2>` +
  SUB.map(s => `
    <div class="recipe">
      <div class="recipe-h">${ico(s.icon)}<div><b>${s.out > 1 ? s.out + " × " : ""}${s.name}</b><small>Çalışma tezgâhında</small></div></div>
      <div class="chips">${Object.entries(s.ins).map(([m, q]) => chip(m, q)).join("")}</div>
    </div>`).join(""));

function render() {
  const k = state.exp, e = EXP[k];
  $("picker").querySelectorAll(".pick").forEach(b => b.setAttribute("aria-pressed", b.dataset.exp === k));

  let E = 0, targets = 0;
  TARGETS.forEach(t => {
    const n = state.counts[t.id] || 0, el = $("tiles").querySelector(`[data-id="${t.id}"]`);
    el.classList.toggle("on", n > 0);
    el.querySelector("output").textContent = n;
    el.querySelector(".badge").textContent = n ? `${t[k] * n}` : "";
    el.querySelector(".need").innerHTML = `${ico(e.icon)}<b>${t[k]}</b> ${e.name} / adet`;
    E += t[k] * n; targets += n;
  });
  $("example-tag").hidden = !state.example;
  const B = breakdown(k, E);

  // Özet şeridi
  const strip = $("strip");
  strip.disabled = E === 0;
  strip.innerHTML = E
    ? `${ico(e.icon, "i big")}<span class="txt"><span class="q">${fmt(E)} × ${e.name}</span><span class="s">${fmt(B.sulfur)} sülfür</span></span><span class="go">${state.tab === "mat" ? "‹ Raid" : "Malzeme ›"}</span>`
    : `${ico(e.icon, "i big")}<span class="txt"><span class="q">Hedef seç</span><span class="s">Kapı ya da duvar ekle</span></span>`;

  // Malzeme ekranı
  const row = (m, v, key, sub) => `<div class="mat${key ? " key" : ""}">${ico(MAT[m].icon)}<span class="nm">${MAT[m].name}${sub ? `<small>${sub}</small>` : ""}</span><span class="v">${fmt(v)}</span></div>`;
  const list = (ms, opts = {}) => ms.filter(m => B[m] > 0).map(m => row(m, B[m], opts.key === m, opts.sub && opts.sub[m])).join("");
  $("view-mat").innerHTML = E ? `
    <div class="hero-need">${ico(e.icon)}<div><div class="n"><span>${fmt(E)}</span> × ${e.name}</div><div class="sub">${targets} hedef için gereken toplam</div></div></div>
    <div class="sec"><h2>Bunu yapmak için</h2><div class="mats">${Object.keys(e.ins).map(m => row(m, e.ins[m] * E, false, `${e.ins[m]} × ${fmt(E)} ${e.name}`)).join("")}</div></div>
    <div class="sec"><h2>Toplanacak ham madde</h2><div class="mats">${list(["sulfur", "char", "frag", "lgf", "cloth", "tech", "pipe", "rope", "stash"].filter(m => !(m in e.ins) || ["sulfur","frag"].includes(m)), { key: "sulfur", sub: { char: "Odun yakarak elde edilir", sulfur: "Barut dahil toplam" } })}</div></div>
    <div class="sec"><h2>Ara ürün</h2><div class="mats">${list(["explosives", "beancan", "gp"].filter(m => !(m in e.ins)), { sub: { gp: "Kendin üretirsen gereken" } })}</div></div>`
    : `<div class="empty">${ico("c4")}<div>Henüz hedef seçmedin.<br>Raid sekmesinden kapı ya da duvar ekle.</div><button class="btn" id="go-raid">Hedef seç</button></div>`;
  const gr = $("go-raid"); if (gr) gr.onclick = () => { state.tab = "raid"; render(); };
  // Boş "Ara ürün" bölümünü gizle
  $("view-mat").querySelectorAll(".mats").forEach(m => { if (!m.children.length) m.parentElement.hidden = true; });

  // Sülfür ekranı
  const s = Math.max(0, Number(state.sulfur) || 0);
  $("craft").innerHTML = Object.keys(EXP).map(x =>
    `<div>${ico(EXP[x].icon)}<b>${fmt(Math.floor(s / unitSulfur(x)))}</b><span>${EXP[x].long}</span><small>${fmt(unitSulfur(x))} sülfür / adet</small></div>`).join("");

  // Sekmeler
  ["raid", "mat", "sulfur", "book"].forEach(v => $("view-" + v).hidden = state.tab !== v);
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  strip.hidden = !(state.tab === "raid" || state.tab === "mat");
  $("top-sub").textContent = { raid: "Raid planla", mat: "Malzeme listesi", sulfur: "Ne kadar yaparım?", book: "Tarifler" }[state.tab];
  save();
}
render();
</script>
