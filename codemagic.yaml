# Raid Hesap: Mac olmadan bulutta iPhone uygulaması derleyip TestFlight'a gönderir.
# Kurulum için app/README.md'deki "Mac'in yoksa: Codemagic" bölümüne bak.
workflows:
  ios-testflight:
    name: Raid Hesap iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: RaidHesapASC   # Codemagic'te App Store Connect API anahtarına verdiğin isim
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.raidhesap.app
      node: 22
      xcode: latest
    scripts:
      - name: Paketleri kur
        script: cd app && npm ci
      - name: Uygulamayı hazırla (web + iOS)
        script: cd app && npm run sync
      - name: Derleme numarasını artır
        script: |
          cd app/ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles
      - name: IPA derle
        script: cd app/ios/App && xcode-project build-ipa --project "App.xcodeproj" --scheme "App"
    artifacts:
      - app/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
